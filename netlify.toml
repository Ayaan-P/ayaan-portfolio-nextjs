[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Proxy Maya API through Netlify (avoids CORS)
[[redirects]]
  from = "/maya-api/*"
  to = "https://maya.ayaanpupala.com/:splat"
  status = 200
  force = true

# Optimize caching for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"